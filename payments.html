<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payment Management</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <!-- Navigation -->

    <nav class="navbar">

        <h2>
            Hotel Management System
        </h2>


        <div>

            <a href="index.html">
                Dashboard
            </a>

            <a href="guests.html">
                Guests
            </a>

            <a href="rooms.html">
                Rooms
            </a>

            <a href="reservations.html">
                Reservations
            </a>

            <a href="employees.html">
                Employees
            </a>

            <a href="payments.html">
                Payments
            </a>

        </div>

    </nav>



    <!-- Main Container -->

    <div class="guest-container">

        <a href="index.html" class="back-button">
            ← Back to Dashboard
        </a>

        <div class="page-header">
            <h1>Payment Management</h1>
        </div>

        <p>
            Add and manage hotel payments.
        </p>



        <!-- Payment Form -->

        <div class="guest-form">

            <h2>
                Add New Payment
            </h2>


            <form id="paymentForm">


                <!-- Booking -->

                <label>
                    Select Booking
                </label>

                <select
                    id="payment_booking"
                    required>

                    <option value="">
                        Select Booking
                    </option>

                </select>



                <!-- Payment Amount -->

                <label>
                    Payment Amount
                </label>

                <input
                    type="number"
                    id="paymentAmount"
                    min="1"
                    step="0.01"
                    required
                >



                <!-- Payment Date -->

                <label>
                    Payment Date
                </label>

                <input
                    type="date"
                    id="payment_date"
                    required
                >



                <!-- Payment Method -->

                <label>
                    Payment Method
                </label>

                <select
                    id="payment_method"
                    required>

                    <option value="">
                        Select Payment Method
                    </option>

                    <option value="Cash">
                        Cash
                    </option>

                    <option value="UPI">
                        UPI
                    </option>

                    <option value="Credit Card">
                        Credit Card
                    </option>

                    <option value="Debit Card">
                        Debit Card
                    </option>

                    <option value="Net Banking">
                        Net Banking
                    </option>

                </select>



                <!-- Payment Status -->

                <label>
                    Payment Status
                </label>

                <select
                    id="payment_status"
                    required>

                    <option value="Paid">
                        Paid
                    </option>

                    <option value="Partial">
                        Partial
                    </option>

                    <option value="Pending">
                        Pending
                    </option>

                </select>



                <button type="submit">
                    Add Payment
                </button>


            </form>

        </div>



        <!-- Payment List -->

        <div class="guest-list">

            <h2>
                Payment List
            </h2>
            <input
    type="text"
    id="paymentSearch"
    placeholder="Search payment by guest, room, method or status..."
    class="search-box"
>


            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Booking</th>

                        <th>Guest</th>

                        <th>Room</th>

                        <th>Booking Amount</th>

                        <th>Payment Amount</th>

                        <th>Date</th>

                        <th>Method</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody
                    id="paymentTableBody">

                </tbody>


            </table>

        </div>

    </div>

<script>
    if (localStorage.getItem("adminLoggedIn") !== "true") {
        window.location.href = "login.html";
    }
</script>

    <script src="script.js"></script>


</body>

</html>

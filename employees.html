<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Employee Management</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <!-- Navigation -->

    <nav class="navbar">

        <h2>
            Hotel Management System
        </h2>


        <div>

            <a href="index.html">
                Dashboard
            </a>

            <a href="guests.html">
                Guests
            </a>

            <a href="rooms.html">
                Rooms
            </a>

            <a href="reservations.html">
                Reservations
            </a>

            <a href="employees.html">
                Employees
            </a>

        </div>

    </nav>



    <!-- Main Container -->

    <div class="guest-container">

        <a href="index.html" class="back-button">
            ← Back to Dashboard
        </a>

        <div class="page-header">
            <h1>Employee Management</h1>
        </div>

        <p>
            Add and manage hotel employees.
        </p>



        <!-- Employee Form -->

        <div class="guest-form">

            <h2>
                Add New Employee
            </h2>


            <form id="employeeForm">


                <!-- Name -->

                <label>
                    Employee Name
                </label>

                <input
                    type="text"
                    id="employee_name"
                    placeholder="Enter employee name"
                    required
                >



                <!-- Phone -->

                <label>
                    Phone Number
                </label>

                <input
                    type="text"
                    id="employee_phone"
                    placeholder="Enter phone number"
                    required
                >



                <!-- Email -->

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="employee_email"
                    placeholder="Enter email"
                    required
                >



                <!-- Role -->

                <label>
                    Role
                </label>

                <input
                    type="text"
                    id="employee_role"
                    placeholder="Enter employee role"
                    required
                >



                <!-- Salary -->

                <label>
                    Salary
                </label>

                <input
                    type="number"
                    id="employee_salary"
                    placeholder="Enter salary"
                    required
                >



                <!-- Department -->

                <label>
                    Department
                </label>

                <select
                    id="employee_department"
                    required>

                    <option value="">
                        Select Department
                    </option>

                </select>



                <button type="submit">
                    Add Employee
                </button>


            </form>

        </div>



        <!-- Employee List -->

        <div class="guest-list">

            <h2>
                Employee List
            </h2>
            <input
    type="text"
    id="employeeSearch"
    placeholder="Search employee by name, role or department..."
    class="search-box"
>


            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Phone</th>

                        <th>Email</th>

                        <th>Role</th>

                        <th>Salary</th>

                        <th>Department</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody
                    id="employeeTableBody">

                </tbody>


            </table>

        </div>

    </div>

<script>
    if (localStorage.getItem("adminLoggedIn") !== "true") {
        window.location.href = "login.html";
    }
</script>

    <script src="script.js"></script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Hotel Management System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-icon">
                🏨
            </div>

            <h1>Hotel Management System</h1>

            <p class="login-subtitle">
                Admin Login
            </p>

            <form id="loginForm">

                <div class="login-field">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                    >

                </div>

                <div class="login-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>

            <p
                id="loginMessage"
                class="login-message"
            ></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
